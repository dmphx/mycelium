<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f4f1}.workflow{width:900px;padding:34px 42px 42px;background:#101013}.top{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9a9aa5;margin-bottom:35px;text-transform:uppercase}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.step{border-top:1px solid #ffffff28;position:relative;padding-top:21px}.step::before{content:'';position:absolute;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}.step span{font:400 11px 'IBM Plex Mono',monospace;color:var(--accent);display:block;margin-bottom:15px}.step strong{font:800 30px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:-.01em}
@media(max-width:600px){.workflow{width:380px;padding:25px 24px 30px}.top{font-size:8px;line-height:1.6;margin-bottom:24px}.steps{grid-template-columns:1fr 1fr;gap:28px 18px}.step{padding-top:13px}.step span{font-size:9px;margin-bottom:10px}.step strong{font-size:24px}}
</style></head><body><div class="workflow" style="--accent:#22d3ee"><div class="top">mycelium / THE EXPERIENCE</div><div class="steps"><div class="step"><span>01</span><strong>DISCOVER</strong></div><div class="step"><span>02</span><strong>REQUEST</strong></div><div class="step"><span>03</span><strong>MATERIALIZE</strong></div><div class="step"><span>04</span><strong>LIBRARY</strong></div></div></div></body></html>
